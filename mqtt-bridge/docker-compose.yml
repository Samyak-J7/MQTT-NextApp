services:
  mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mqtt-bridge
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bridge_healthy"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
