# fly.toml app configuration file generated for mqtt-nextapp on 2026-04-25T08:12:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mqtt-nextapp'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[deploy]
  restart_policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
